<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <script>try { if (localStorage.getItem('sigoa_theme') === 'dark') document.documentElement.classList.add('dark-mode'); } catch (error) {}</script>
    <title>Redefinir senha | SIGOA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/theme.js" defer></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <main class="relative w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
        <button type="button" data-theme-toggle aria-label="Ativar modo escuro" title="Ativar modo escuro"
                class="absolute right-4 top-4 rounded-xl p-2 text-slate-500 hover:bg-slate-100 transition">
            <i data-lucide="moon" class="w-4 h-4"></i>
        </button>
        <h1 class="text-2xl font-bold text-slate-900">Redefinir senha</h1>
        <p class="mt-2 text-sm text-slate-600">Escolha uma nova senha com pelo menos 8 caracteres.</p>
        <form id="resetForm" class="mt-6 space-y-4">
            <input type="hidden" id="token" value="{{ token }}">
            <label class="block text-sm font-medium text-slate-700">Nova senha
                <input id="password" type="password" minlength="8" required autocomplete="new-password"
                       class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
            </label>
            <label class="block text-sm font-medium text-slate-700">Confirmar senha
                <input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"
                       class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2">
            </label>
            <p id="message" role="status" class="text-sm" aria-live="polite"></p>
            <button class="w-full rounded-lg bg-blue-700 px-4 py-2 font-semibold text-white hover:bg-blue-800">Salvar nova senha</button>
        </form>
        <a class="mt-5 inline-block text-sm text-blue-700 hover:underline" href="{{ url_for('login') }}">Voltar ao login</a>
    </main>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = document.getElementById('message');
            const response = await fetch('{{ url_for("reset_password") }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token: document.getElementById('token').value,
                    password: document.getElementById('password').value,
                    confirm_password: document.getElementById('confirmPassword').value
                })
            });
            const result = await response.json();
            message.textContent = result.message || result.error || 'Não foi possível redefinir a senha.';
            message.className = response.ok ? 'text-sm text-emerald-700' : 'text-sm text-rose-700';
        });
    </script>
</body>
</html>
